<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-5">
            <div class="card portal-card shadow-sm border-0 p-4 p-md-5">
                <h3 class="text-center mb-4">Job Portal Login</h3>

                <form th:action="@{/login}" th:object="${loginUser}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                        <div class="text-danger" th:errors="*{email}"></div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" th:field="*{password}" id="loginPassword" class="form-control">
                            <button class="btn btn-outline-secondary" type="button" onclick="toggleLoginPassword()">
                                <i class="bi bi-eye" id="loginEyeIcon"></i>
                            </button>
                        </div>
                        <div class="text-danger" th:errors="*{password}"></div>
                    </div>

                    <!-- Login error -->
                    <div class="text-danger mb-3" th:text="${error}"></div>

                    <button type="submit" class="btn btn-primary w-100 portal-btn">
                        Login
                    </button>

                    <div class="text-center mt-3">
                        <a href="/register" class="text-decoration-none fw-semibold">Create Account</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="/Js/login.js"></script>

</body>
</html>

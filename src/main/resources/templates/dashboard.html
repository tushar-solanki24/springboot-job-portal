<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <div th:replace="fragments/pageHeader :: pageHeader(
    'Dashboard',
    'Quick links to key sections'
    )"></div>

    <div class="row g-4">

        <!-- VIEW JOBS -->
        <div class="col-12 col-md-4">
            <a href="/viewJobs" class="text-decoration-none text-reset">
                <div class="card portal-card shadow-sm border-0 h-100">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-search fs-1 text-primary"></i>
                        <h5 class="mt-3">View Jobs</h5>
                        <p class="text-muted mb-0">Browse available jobs</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- JOB SEEKER SECTION -->
        <div class="col-12 col-md-4"
             th:if="${currentUser != null and currentUser.role == 'JOBSEEKER'}">
            <a href="/myApplications" class="text-decoration-none text-reset">
                <div class="card portal-card shadow-sm border-0 h-100">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-file-earmark-text fs-1 text-success"></i>
                        <h5 class="mt-3">My Applications</h5>
                        <p class="text-muted mb-0">Track your job applications</p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-12 col-md-4"
             th:if="${currentUser != null and currentUser.role == 'JOBSEEKER'}">
            <a href="/savedJobs" class="text-decoration-none text-reset">
                <div class="card portal-card shadow-sm border-0 h-100">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-heart fs-1 text-danger"></i>
                        <h5 class="mt-3">Saved Jobs</h5>
                        <p class="text-muted mb-0">Jobs you saved</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- RECRUITER SECTION -->
        <div class="col-12 col-md-4"
             th:if="${currentUser != null and currentUser.role == 'RECRUITER'}">
            <a href="/addJob" class="text-decoration-none text-reset">
                <div class="card portal-card shadow-sm border-0 h-100">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-plus-circle fs-1 text-warning"></i>
                        <h5 class="mt-3">Add Job</h5>
                        <p class="text-muted mb-0">Post a new job</p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-12 col-md-4"
             th:if="${currentUser != null and currentUser.role == 'RECRUITER'}">
            <a href="/myJobs" class="text-decoration-none text-reset">
                <div class="card portal-card shadow-sm border-0 h-100">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-briefcase fs-1 text-info"></i>
                        <h5 class="mt-3">My Jobs</h5>
                        <p class="text-muted mb-0">Manage posted jobs</p>
                    </div>
                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>

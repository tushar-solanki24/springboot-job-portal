<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">

    <style>
        .profile-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #0d6efd;
        }
    </style>
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <div class="card portal-card shadow-sm border-0" style="max-width: 600px; margin: 0 auto;">
        <div class="card-body text-center">

            <div th:replace="fragments/pageHeader :: pageHeader(
            'My Profile',
            'Manage your personal information and skills'
            )"></div>

            <!-- PROFILE IMAGE -->
            <img th:src="${user.profileImage != null} ? @{'/uploads/' + ${user.profileImage}} : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'"
                 class="profile-img mb-3" alt="Profile image">

            <h4 th:text="${user.username}"></h4>
            <p class="text-muted">Job Seeker</p>

            <hr>

            <div class="row text-start g-3">
                <div class="col-md-6">
                    <i class="bi bi-envelope me-2"></i>
                    <strong>Email</strong>
                    <div class="mt-1">
                        <span th:text="${user.email}"></span>
                    </div>
                </div>

                <div class="col-md-6">
                    <i class="bi bi-phone me-2"></i>
                    <strong>Mobile</strong>
                    <div class="mt-1">
                        <span th:text="${user.mobile}"></span>
                    </div>
                </div>

                <div class="col-12">
                    <i class="bi bi-tools me-2"></i>
                    <strong>Skills</strong>
                    <div class="mt-1">
                        <span th:text="${user.skills}"></span>
                    </div>
                </div>
            </div>

            <a href="/editProfile" class="btn btn-primary mt-4 portal-btn">
                <i class="bi bi-pencil me-1"></i> Edit Profile
            </a>

        </div>
    </div>

</div>

</body>
</html>

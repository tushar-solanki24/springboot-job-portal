<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">

    <style>
        #suggestions {
            z-index: 1000;
            max-height: 240px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <div th:replace="fragments/pageHeader :: pageHeader(
    'Available Jobs',
    'Search and apply for jobs that match your skills'
    )"></div>

    <!-- SEARCH BAR -->
    <div class="card portal-card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form th:action="@{/viewJobs}" method="get" class="row g-2">
                <div class="col-md-5 position-relative">
                    <input type="text"
                           id="jobSearch"
                           name="title"
                           class="form-control"
                           placeholder="Job title (Java, Spring...)">

                    <ul id="suggestions"
                        class="list-group position-absolute w-100 shadow"></ul>
                </div>

                <div class="col-md-5">
                    <input type="text"
                           name="location"
                           class="form-control"
                           placeholder="Location (Ahmedabad, Pune...)">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100 portal-btn" type="submit">
                        Search
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JOB CARDS -->
    <div class="card portal-card shadow-sm border-0">
        <div class="card-header bg-dark text-white d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
            <h4 class="mb-0">Available Jobs</h4>
            <span class="text-white-50">
                Showing <span th:text="${jobs.size()}"></span> jobs
            </span>
        </div>

        <div class="card-body">

            <div class="row g-4">
                <div class="col-12 col-lg-6" th:each="job : ${jobs}">
                    <div class="card portal-card shadow-sm border-0 h-100">
                        <div class="card-body">

                            <div class="d-flex justify-content-between align-items-start gap-3">
                                <div>
                                    <h5 class="mb-2" th:text="${job.jobTitle}">Job Title</h5>

                                    <div class="text-muted d-flex flex-wrap gap-3">
                                        <span>
                                            <i class="bi bi-building me-1"></i>
                                            <span th:text="${job.companyName}"></span>
                                        </span>
                                        <span>
                                            <i class="bi bi-geo-alt me-1"></i>
                                            <span th:text="${job.location}"></span>
                                        </span>
                                    </div>
                                </div>

                                <div class="text-end">
                                    <div class="badge bg-primary rounded-pill px-3 py-2" th:text="${job.salary}"></div>
                                </div>
                            </div>

                            <div class="mt-3">
                                <div class="small text-muted mb-1">Experience</div>
                                <div class="fw-semibold" th:text="${job.experience}"></div>
                            </div>

                            <div class="mt-3">
                                <div class="small text-muted mb-1">Description</div>
                                <p class="text-muted mb-3"
                                   th:text="${job.description}"
                                   style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;"></p>
                            </div>

                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <a th:href="@{/viewJob/{id}(id=${job.jobId})}"
                                   class="btn btn-outline-primary btn-sm portal-btn">
                                    <i class="bi bi-eye me-1"></i>
                                    View Details
                                </a>

                                <!-- If already applied -->
                                <span th:if="${appliedJobIds.contains(job.jobId)}"
                                      class="badge bg-secondary">
                                    Applied
                                </span>

                                <!-- Show Apply only if NOT applied -->
                                <a th:if="${!appliedJobIds.contains(job.jobId) and currentUser != null and currentUser.role == 'JOBSEEKER'}"
                                   th:href="@{/applyJobPage/{id}(id=${job.jobId})}"
                                   class="btn btn-success btn-sm portal-btn">
                                    <i class="bi bi-send me-1"></i>
                                    Apply
                                </a>

                                <!-- If job is already saved -->
                                <a th:if="${savedJobIds.contains(job.jobId)}"
                                   th:href="@{/unsaveJob/{id}(id=${job.jobId})}"
                                   class="btn btn-danger btn-sm portal-btn">
                                    <i class="bi bi-heart-fill me-1"></i>
                                    Saved
                                </a>

                                <!-- If job is NOT saved -->
                                <a th:if="${!savedJobIds.contains(job.jobId)}"
                                   th:href="@{/saveJob/{id}(id=${job.jobId})}"
                                   class="btn btn-outline-danger btn-sm portal-btn">
                                    <i class="bi bi-heart me-1"></i>
                                    Save
                                </a>
                            </div>

                        </div>
                    </div>
                </div>

                <div th:if="${jobs.size() == 0}" class="col-12">
                    <div class="alert alert-light border portal-card shadow-sm text-muted mb-0">
                        No jobs match your search.
                    </div>
                </div>
            </div>

            <!-- PAGINATION -->
            <div class="mt-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <a th:if="${currentPage > 0}"
                       th:href="@{/viewJobs(page=${currentPage-1})}"
                       class="btn btn-outline-secondary btn-sm portal-btn">
                        Previous
                    </a>

                    <div class="text-muted small">
                        Page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span>
                    </div>

                    <a th:if="${currentPage < totalPages - 1}"
                       th:href="@{/viewJobs(page=${currentPage+1})}"
                       class="btn btn-outline-secondary btn-sm portal-btn">
                        Next
                    </a>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="/Js/search.js"></script>

</body>
</html>

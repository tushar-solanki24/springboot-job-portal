<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">
            <div class="card portal-card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h3 class="text-center mb-4">Add Job</h3>

                    <form th:action="@{/saveJob}" th:object="${job}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Job Title</label>
                                <input type="text"
                                       th:field="*{jobTitle}"
                                       class="form-control"
                                       placeholder="Ex: Java Developer">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Company Name</label>
                                <input type="text"
                                       th:field="*{companyName}"
                                       class="form-control"
                                       placeholder="Ex: TCS">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Location</label>
                                <input type="text"
                                       th:field="*{location}"
                                       class="form-control"
                                       placeholder="Ex: Ahmedabad">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Salary (LPA)</label>
                                <input type="text"
                                       th:field="*{salary}"
                                       class="form-control"
                                       placeholder="Ex: 3 LPA">
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Experience</label>
                                <input type="text"
                                       th:field="*{experience}"
                                       class="form-control"
                                       placeholder="Ex: 2 Years">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea th:field="*{description}"
                                          class="form-control"
                                          rows="4"
                                          placeholder="Enter job description"></textarea>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg portal-btn">
                                Save Job
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">
            <div class="card portal-card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-2 mb-4">
                        <div>
                            <h4 class="mb-0">Edit Profile</h4>
                            <div class="text-muted small">Update your personal details and skills</div>
                        </div>
                    </div>

                    <form th:action="@{/updateProfile}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label">Profile Picture</label>
                            <input type="file" name="profileImage" class="form-control">
                        </div>

                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label">Username</label>
                                <input type="text"
                                       name="username"
                                       th:value="${user.username}"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email"
                                       name="email"
                                       th:value="${user.email}"
                                       class="form-control"
                                       readonly>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Mobile</label>
                                <input type="text"
                                       name="mobile"
                                       th:value="${user.mobile}"
                                       class="form-control">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Skills</label>
                                <input type="text"
                                       id="skillSearch"
                                       name="skills"
                                       th:value="${user.skills}"
                                       class="form-control"
                                       placeholder="Add skills (Java, Spring...)">
                                <ul id="skillSuggestions" class="list-group mt-2"></ul>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button class="btn btn-success btn-lg portal-btn" type="submit">
                                Update Profile
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="/Js/skills.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Applicants</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-4">
        <h3 class="mb-0">Applicants</h3>
        <div class="text-muted small">
            Total: <span th:text="${applications.size()}"></span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-6" th:each="app : ${applications}">
            <div class="card portal-card shadow-sm border-0 h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div>
                            <h5 class="mb-2">Applicant ID: <span th:text="${app.userId}"></span></h5>
                            <div class="text-muted mb-3">
                                Applied on: <span th:text="${app.appliedDate}"></span>
                            </div>
                        </div>

                        <div class="text-end">
                            <a th:href="@{'/uploads/' + ${app.resumePath}}"
                               class="btn btn-success btn-sm portal-btn"
                               target="_blank">
                                Download Resume
                            </a>
                        </div>
                    </div>

                    <hr class="my-3">

                    <form th:action="@{/updateStatus}" method="post" class="row g-2 align-items-end">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <input type="hidden"
                               name="applicationId"
                               th:value="${app.applicationId}">

                        <div class="col-12 col-md-7">
                            <label class="form-label small text-muted">Update status</label>
                            <select name="status" class="form-select form-select-sm">
                                <option value="Applied">Applied</option>
                                <option value="Under Review">Under Review</option>
                                <option value="Shortlisted">Shortlisted</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-5">
                            <button class="btn btn-primary portal-btn w-100" type="submit">
                                Update
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${applications.size() == 0}" class="col-12">
            <div class="alert alert-light border portal-card shadow-sm text-muted mb-0">
                No applicants found for this job.
            </div>
        </div>
    </div>

</div>

</body>
</html>

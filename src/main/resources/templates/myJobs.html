<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-4">
        <h3 class="mb-0">My Posted Jobs</h3>
        <div class="text-muted small">
            Total: <span th:text="${jobs.size()}"></span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-6" th:each="job : ${jobs}">
            <div class="card portal-card shadow-sm border-0 h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div>
                            <h5 class="mb-2" th:text="${job.jobTitle}">Job Title</h5>
                            <div class="text-muted">
                                <div th:text="${job.companyName}"></div>
                                <div th:text="${job.location}"></div>
                            </div>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-primary rounded-pill px-3 py-2"
                                  th:text="${counts[job.jobId] != null ? counts[job.jobId] : 0} + ' Applicants'">
                                0 Applicants
                            </span>
                        </div>
                    </div>

                    <div class="mt-3 d-flex flex-wrap gap-2">
                        <a th:href="@{/viewApplicants/{jobId}(jobId=${job.jobId})}"
                           class="btn btn-primary btn-sm portal-btn">
                            View Applicants
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${jobs.size() == 0}" class="col-12">
            <div class="alert alert-light border portal-card shadow-sm text-muted mb-0">
                You haven't posted any jobs yet.
            </div>
        </div>
    </div>

</div>

</body>
</html>

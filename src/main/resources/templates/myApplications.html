<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <div th:replace="fragments/pageHeader :: pageHeader(
    'My Applications',
    'Track all the jobs you applied for'
    )"></div>

    <div class="row g-4">
        <div class="col-12 col-lg-6" th:each="app : ${applications}">
            <div class="card portal-card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 th:text="${app.job.jobTitle}"></h5>

                    <p class="text-muted mb-2">
                        <i class="bi bi-building me-1"></i>
                        <span th:text="${app.job.companyName}"></span>
                    </p>

                    <p class="mb-2">
                        <strong>Status:</strong>
                        <span class="badge bg-info" th:text="${app.status}"></span>
                    </p>

                    <p class="mb-2">
                        <i class="bi bi-geo-alt me-1"></i>
                        <span th:text="${app.job.location}"></span>
                    </p>

                    <p class="mb-0">
                        <i class="bi bi-calendar me-1"></i>
                        Applied on:
                        <span th:text="${app.appliedDate}"></span>
                    </p>

                    <div class="mt-3">
                        <span class="badge bg-success">Application Submitted</span>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${applications.size() == 0}" class="col-12">
            <div class="alert alert-light border portal-card shadow-sm text-muted mb-0">
                You haven’t applied to any jobs yet.
            </div>
        </div>
    </div>

</div>

</body>
</html>

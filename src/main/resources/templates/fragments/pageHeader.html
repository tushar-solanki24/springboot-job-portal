<!-- Reusable page header (fragment) -->
<div th:fragment="pageHeader(title, subtitle)" class="mb-4">
  <div class="d-flex flex-column flex-md-row align-items-md-baseline justify-content-between gap-2">
    <h3 class="fw-bold mb-0" th:text="${title}">Page Title</h3>
  </div>

  <p class="text-muted mb-0 mt-1" th:text="${subtitle}">Page subtitle description</p>
  <hr class="mt-3 mb-0">
</div>

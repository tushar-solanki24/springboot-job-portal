<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apply Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">
            <div class="card portal-card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h3 class="mb-3" th:text="${job.jobTitle}">Job Title</h3>

                    <div class="row g-2 mb-4">
                        <div class="col-12 col-md-6">
                            <div class="text-muted small">Company</div>
                            <div class="fw-semibold" th:text="${job.companyName}"></div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="text-muted small">Location</div>
                            <div class="fw-semibold" th:text="${job.location}"></div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <form th:action="@{/applyJob}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="jobId" th:value="${job.jobId}">

                        <div class="mb-3">
                            <label class="form-label">Upload Resume (PDF)</label>
                            <input type="file" name="resume" class="form-control" required>
                        </div>

                        <div class="d-grid mt-4">
                            <button class="btn btn-success btn-lg portal-btn" type="submit">
                                Submit Application
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saved Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-4">
        <h3 class="mb-0">Saved Jobs</h3>
        <div class="text-muted small">
            Total: <span th:text="${savedJobs.size()}"></span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-6" th:each="saved : ${savedJobs}">
            <div class="card portal-card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 th:text="${saved.job.jobTitle}" class="mb-2"></h5>
                    <div class="text-muted mb-3">
                        <div th:text="${saved.job.companyName}"></div>
                        <div th:text="${saved.job.location}"></div>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/viewJob/{id}(id=${saved.job.jobId})}"
                           class="btn btn-outline-primary btn-sm portal-btn">
                            View Details
                        </a>
                        <a th:href="@{/removeSavedJob/{id}(id=${saved.job.jobId})}"
                           class="btn btn-outline-danger btn-sm portal-btn">
                            Remove
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${savedJobs.size() == 0}" class="col-12">
            <div class="alert alert-light border portal-card shadow-sm text-muted mb-0">
                You haven’t saved any jobs yet.
            </div>
        </div>
    </div>

</div>

</body>
</html>

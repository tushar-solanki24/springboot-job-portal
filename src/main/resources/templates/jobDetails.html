<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/portal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="card portal-card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                <div>
                    <h3 class="mb-2" th:text="${job.jobTitle}">Job Title</h3>
                    <p class="text-muted mb-0">
                        <i class="bi bi-building me-2"></i><span th:text="${job.companyName}"></span>
                        <span class="mx-2">•</span>
                        <i class="bi bi-geo-alt me-2"></i><span th:text="${job.location}"></span>
                    </p>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <span class="badge bg-primary rounded-pill px-3 py-2" th:text="${job.salary}"></span>
                    <span class="badge bg-info rounded-pill px-3 py-2">
                        <span class="me-1">Experience:</span>
                        <span th:text="${job.experience}"></span>
                    </span>
                </div>
            </div>

            <hr class="my-4">

            <h5 class="mb-3">Description</h5>
            <p class="text-muted" th:text="${job.description}"></p>

            <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                <a th:href="@{/applyJobPage/{id}(id=${job.jobId})}" class="btn btn-success btn-lg portal-btn">
                    <i class="bi bi-send me-1"></i> Apply Job
                </a>
                <a href="/viewJobs" class="btn btn-outline-secondary btn-lg portal-btn">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
